  <main id="stage" aria-label="Interactive Gothic Sun sculpture" aria-describedby="instruction"></main>
  <div class="vignette" aria-hidden="true"></div>
  <div class="burn-frame" aria-hidden="true"></div>
  <div class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="masthead" data-ui>
    <div class="identity">
      <p class="eyebrow">Worlds / 3D toy</p>
      <h1>SOL<span class="title-period">.</span></h1>
      <p class="subtitle">A sun you can poke.</p>
    </div>
    <nav class="tools" aria-label="Scene controls">
      <button id="sound-toggle" class="tool-button" type="button" aria-pressed="true">Sound on</button>
      <button id="pause-toggle" class="tool-button" type="button" aria-pressed="false">Pause</button>
      <button id="reduced-toggle" class="tool-button" type="button" aria-pressed="false">Calm motion</button>
      <button id="reset-button" class="tool-button tool-button--quiet" type="button">Reset</button>
    </nav>
  </header>

  <div class="turn-control turn-control--left" data-ui>
    <button id="spin-left" class="turn-button" type="button" aria-label="Turn left, counterclockwise">
      <span class="turn-line" aria-hidden="true"></span>
      <span>Turn left</span>
    </button>
  </div>
  <div class="turn-control turn-control--right" data-ui>
    <button id="spin-right" class="turn-button" type="button" aria-label="Turn right, clockwise">
      <span class="turn-line" aria-hidden="true"></span>
      <span>Turn right</span>
    </button>
  </div>

  <footer class="dashboard" data-ui>
    <section class="telemetry" aria-label="Sun motion">
      <p class="status-line"><span id="mode-label">RESTLESS</span><span id="turbo-time"></span></p>
      <p class="speed"><span id="speed-value">0.2</span><span class="speed-unit">rpm</span></p>
      <p id="direction-label" class="direction-label">CLOCKWISE</p>
    </section>

    <section class="ignition" aria-label="Turbo charge">
      <div class="charge-heading">
        <span id="charge-label">5 QUICK TAPS TO IGNITE</span>
        <span id="charge-count">0 / 5</span>
      </div>
      <div class="charge-track" aria-hidden="true"><div id="charge-fill"></div></div>
      <p class="ignition-note">Five quick taps. Ten seconds of fire.</p>
    </section>

    <div class="instructions">
      <p id="instruction">Tap or click either side</p>
      <p class="instruction-secondary">It watches your cursor.</p>
    </div>
  </footer>

    <span class="loading-orbit" aria-hidden="true"></span>
    <span>Loading SOL</span>
  </div>
